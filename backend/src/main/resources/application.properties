spring.application.name=ikernell-backend

# ==============================================================
# Configuración de Base de Datos PostgreSQL
# ==============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/backend_db
spring.datasource.username=abrah
spring.datasource.password=abrah1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================
# Pool de Conexiones HikariCP (Alta Concurrencia - RNF)
# ==============================================================
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=IKernellHikariPool
spring.datasource.hikari.leak-detection-threshold=15000

# ==============================================================
# Configuración de Hibernate / JPA
# ==============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# ==============================================================
# Configuración de Spring Batch (Innovación 2 - ETL Brasil)
# ==============================================================
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# ==============================================================
# Configuración JWT (Custom)
# ==============================================================
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# ==============================================================
# Configuración del Servidor Embebido
# ==============================================================
server.port=8080
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

# ==============================================================
# Pool de Hilos Asíncronos (@Async)
# ==============================================================
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=IKernell-Async-

# ==============================================================
# Logging
# ==============================================================
logging.level.com.ikernell=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=INFO
