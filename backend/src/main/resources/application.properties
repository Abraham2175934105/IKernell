spring.application.name=ikernell-backend

# ==============================================================
# Configuración de Base de Datos PostgreSQL
# ==============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/backend_db
spring.datasource.username=abrah
spring.datasource.password=abrah1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================
# Pool de Conexiones HikariCP (Optimizado para Stress Testing & Alta Concurrencia)
# ==============================================================
spring.datasource.hikari.pool-name=IKernellHikariPool
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=20000
spring.datasource.hikari.connection-test-query=SELECT 1

# ==============================================================
# Configuración de Hibernate / JPA
# ==============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.open-in-view=false

# ==============================================================
# Configuración de Spring Batch (Innovación 2 - ETL Brasil)
# ==============================================================
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# ==============================================================
# Configuración JWT (Stateless Authentication - RNF-08 a RNF-10)
# ==============================================================
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# ==============================================================
# Configuración del Servidor Embebido (Compresión y Optimización HTTP)
# ==============================================================
server.port=8080
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000

# ==============================================================
# Pool de Hilos Asíncronos (@Async - RNF-05)
# ==============================================================
spring.task.execution.pool.core-size=6
spring.task.execution.pool.max-size=24
spring.task.execution.pool.queue-capacity=150
spring.task.execution.thread-name-prefix=IKernell-Async-
spring.task.execution.pool.keep-alive=60s

# ==============================================================
# Logging
# ==============================================================
logging.level.com.ikernell=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=INFO

