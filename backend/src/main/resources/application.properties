spring.application.name=ikernell-backend

# ==============================================================
# Configuración de Base de Datos PostgreSQL
# ==============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/backend_db}
spring.datasource.username=${DB_USERNAME:abrah}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================
# Pool de Conexiones HikariCP (Optimizado para Concurrencia Equilibrada)
# ==============================================================
spring.datasource.hikari.pool-name=IKernellHikariPool
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:30}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=15000
spring.datasource.hikari.connection-test-query=SELECT 1

# ==============================================================
# Configuración de Hibernate / JPA
# ==============================================================
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.open-in-view=false

# ==============================================================
# Configuración de Spring Batch (Innovación 2 - ETL Brasil)
# ==============================================================
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# ==============================================================
# Configuración JWT (Stateless Authentication - RNF-08 a RNF-10)
# ==============================================================
jwt.secret=${JWT_SECRET:IkernellSuperSecretKeyForJWTAuthTokenGeneration2026SecureKeyWithAtLeast384BitsLong!}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ==============================================================
# Configuración del Servidor Embebido (Compresión y Optimización HTTP)
# ==============================================================
server.port=8080
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000

# ==============================================================
# Pool de Hilos Asíncronos (@Async - RNF-05 / Analítica y ETL)
# ==============================================================
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=200
spring.task.execution.thread-name-prefix=IKernell-Async-
spring.task.execution.pool.keep-alive=60s

# ==============================================================
# Configuración de Envío Real de Correo (Spring Mail / SMTP)
# ==============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:abrahamboada95@gmail.com}
spring.mail.password=${MAIL_PASSWORD:uryk vizr cwcq utij}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# ==============================================================
# Logging
# ==============================================================
logging.level.com.ikernell=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=INFO
